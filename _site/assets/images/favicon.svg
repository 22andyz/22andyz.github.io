<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="obg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#f27a5c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#05060f"/>

  <!-- stars -->
  <circle cx="10" cy="10" r="1.3" fill="#ffffff" opacity="0.8"/>
  <circle cx="52" cy="14" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="46" cy="8" r="1.1" fill="#ffffff" opacity="0.7"/>

  <!-- ground -->
  <rect x="0" y="52" width="64" height="12" fill="#0c0e1f"/>

  <!-- observatory base (cylinder) -->
  <rect x="18" y="38" width="28" height="16" fill="url(#obg)" opacity="0.25" stroke="url(#obg)" stroke-width="2"/>

  <!-- dome -->
  <path d="M16 38 a16 16 0 0 1 32 0 Z" fill="url(#obg)" opacity="0.9"/>

  <!-- dome slit -->
  <path d="M32 24 L42 6" stroke="#05060f" stroke-width="5" stroke-linecap="round"/>

  <!-- telescope barrel poking through slit -->
  <path d="M31 25 L44 4" stroke="url(#obg)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="44" cy="4" r="2.6" fill="url(#obg)"/>
</svg>
