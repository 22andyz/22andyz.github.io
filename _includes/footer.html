<footer class="site-footer">
  <div class="wrapper">
    <p>
      &copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}.
      Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a>.
    </p>
    <p class="social-links">
      {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
      {% if site.author.twitter %}<a href="https://twitter.com/{{ site.author.twitter }}" target="_blank" rel="noopener">Twitter</a>{% endif %}
      {% if site.author.linkedin %}<a href="https://linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
    </p>
  </div>
</footer>
