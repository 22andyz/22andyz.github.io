---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {% if page.date %}{{ page.date | date: "%B %-d, %Y" }}{% endif %}
      {% if page.tags.size > 0 %}
        &middot;
        {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      {% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/other/' | relative_url }}">&larr; Back to all posts</a>
  </footer>
</article>
