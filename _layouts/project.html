---
layout: default
---
<article class="project">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.tech %}
      <p class="post-meta">{{ page.tech | join: " · " }}</p>
    {% endif %}
    {% if page.link %}
      <p><a href="{{ page.link }}" target="_blank" rel="noopener">View project &rarr;</a></p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/projects/' | relative_url }}">&larr; Back to all projects</a>
  </footer>
</article>
